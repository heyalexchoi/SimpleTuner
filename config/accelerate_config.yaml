# goes to ~/.cache/huggingface/accelerate/default_config.yaml 
compute_environment: LOCAL_MACHINE
# distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: 'all'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

# for debugging. pdb totally breaks with multi-gpu
distributed_type: NO
debug: true
# enable_cpu_affinity: false
